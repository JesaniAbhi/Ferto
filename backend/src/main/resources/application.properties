# Application Port
server.port=8080

# Application Name
spring.application.name=ferto-backend

# ==========================================
# 1. H2 Database Configuration (Default Development)
# ==========================================
spring.datasource.url=jdbc:h2:mem:fertodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# 2. PostgreSQL Configuration (Commented out - Production)
# ==========================================
# spring.datasource.url=jdbc:postgresql://localhost:5420/fertodb
# spring.datasource.username=postgres
# spring.datasource.password=postgres123
# spring.datasource.driverClassName=org.postgresql.Driver

# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For PostgreSQL, use this dialect instead:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. Security and JWT Configurations
# ==========================================
# Secret key must be a base64 encoded string of at least 256 bits
ferto.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLWp3dC1zZWNyZXQta2V5LXdoaWNoLXNob3VsZC1iZS1rZXB0LWNvbmZpZGVudGlhbC1hbmQtc2FmZQ==
ferto.jwt.expiration-ms=604800000

# ==========================================
# 4. Machine Learning & Weather API integrations
# ==========================================
ferto.ml.service.url=http://localhost:8000
ferto.weather.api.url=https://api.openweathermap.org/data/2.5/weather
ferto.weather.api.key=YOUR_OPENWEATHERMAP_API_KEY
